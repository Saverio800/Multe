<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestione Multe</title>
<style>
:root{
  color-scheme: light;
  --bg:#f6f6f4; --surface:#ffffff; --surface-2:#f1f1ee; --border:#e2e1dc; --border-strong:#cfcdc6;
  --text:#1a1a19; --text-2:#52514e; --muted:#7c7b76;
  --accent:#2a78d6; --accent-ink:#1c5cab; --accent-soft:#e6f0fc;
  --critical:#d03b3b; --serious:#ec835a; --warning:#fab219; --good:#0ca30c;
  --critical-soft:#fbe9e9; --serious-soft:#fdf0ea; --warning-soft:#fef6e2; --good-soft:#e7f6e7;
  --bar:#2a78d6; --bar-soft:#cde2fb; --extra:#eb6834;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --border:#2f2e2b; --border-strong:#454440;
    --text:#f3f2ee; --text-2:#c3c2b7; --muted:#8f8e86;
    --accent:#3987e5; --accent-ink:#86b6ef; --accent-soft:#16283f;
    --critical-soft:#3a1c1c; --serious-soft:#3a261c; --warning-soft:#3a3018; --good-soft:#15301a;
    --bar:#3987e5; --bar-soft:#1c3a5e; --extra:#d95926; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --border:#2f2e2b; --border-strong:#454440;
  --text:#f3f2ee; --text-2:#c3c2b7; --muted:#8f8e86;
  --accent:#3987e5; --accent-ink:#86b6ef; --accent-soft:#16283f;
  --critical-soft:#3a1c1c; --serious-soft:#3a261c; --warning-soft:#3a3018; --good-soft:#15301a;
  --bar:#3987e5; --bar-soft:#1c3a5e; --extra:#d95926; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-ink)}
.num{font-variant-numeric:tabular-nums}
/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.top-in{max-width:1400px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand .logo{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px}
nav.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:9px}
nav.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:7px;cursor:pointer;color:var(--text-2);font-weight:500}
nav.tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.spacer{flex:1}
.arch{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);padding:5px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.btn{border:1px solid var(--border-strong);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--critical)}
.btn:disabled{opacity:.5;cursor:default}
main{max-width:1400px;margin:0 auto;padding:18px 20px 60px}
.banner{padding:10px 14px;border-radius:var(--radius);margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--border)}
.banner.warn{background:var(--warning-soft);border-color:transparent}
.banner.info{background:var(--accent-soft);border-color:transparent}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.kpi .l{font-size:12px;color:var(--text-2);font-weight:500}
.kpi .v{font-size:24px;font-weight:650;letter-spacing:-.02em;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
.card-h h2{font-size:14px;margin:0;font-weight:650}
.card-h .sub{color:var(--muted);font-size:12.5px}
/* todo */
.todo{margin-bottom:16px}
.todo-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;padding:12px 14px}
.todo-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);cursor:pointer}
.todo-item:hover{background:var(--surface-2)}
.todo-item .when{width:112px;flex:none}
.todo-item .when b{display:block;font-size:13px}
.todo-item .what{font-size:13px;min-width:0}
.todo-item .what .st{font-weight:650;font-size:14px;margin-bottom:2px}
.todo-item .what .sc{color:var(--text-2);margin-bottom:2px}
.todo-item .id-l{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo-item .what .m{color:var(--text-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;line-height:1.5}
.pill .dot{width:7px;height:7px}
.lv-scaduta{background:var(--critical-soft);color:var(--critical)} .lv-scaduta .dot{background:var(--critical)}
.lv-urgente{background:var(--serious-soft);color:#b8532b} .lv-urgente .dot{background:var(--serious)}
.lv-vicina{background:var(--warning-soft);color:#8a6100} .lv-vicina .dot{background:var(--warning)}
.lv-ok{background:var(--surface-2);color:var(--text-2)} .lv-ok .dot{background:var(--muted)}
.lv-attesa{background:var(--accent-soft);color:var(--accent-ink)} .lv-attesa .dot{background:var(--accent)}
.lv-chiusa{background:var(--good-soft);color:#177a17} .lv-chiusa .dot{background:var(--good)}
:root[data-theme="dark"] .lv-urgente{color:var(--serious)} :root[data-theme="dark"] .lv-vicina{color:var(--warning)} :root[data-theme="dark"] .lv-chiusa{color:#5fcf5f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lv-urgente{color:var(--serious)} :root:not([data-theme="light"]) .lv-vicina{color:var(--warning)} :root:not([data-theme="light"]) .lv-chiusa{color:#5fcf5f}}
/* filters + table */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border)}
.filters input[type=search]{flex:1;min-width:200px}
.inp, .filters input, .filters select{border:1px solid var(--border-strong);background:var(--surface);border-radius:7px;padding:6px 9px;min-height:32px}
.tbl-wrap{overflow:auto;max-height:calc(100vh - 170px)}
table.list{width:100%;border-collapse:collapse;font-size:13px}
table.list th{position:sticky;top:0;background:var(--surface);text-align:left;font-weight:600;color:var(--text-2);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--border-strong);cursor:pointer;white-space:nowrap;user-select:none;z-index:1}
table.list th.r,table.list td.r{text-align:right}
table.list td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
table.list tbody tr{cursor:pointer}
table.list tbody tr:hover td{background:var(--surface-2)}
table.list tr.closed td{color:var(--text-2)}
.verb{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.warnmark{color:var(--critical);font-weight:700}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--text-2);margin-left:4px}
.foot{padding:9px 14px;color:var(--text-2);font-size:12.5px;display:flex;gap:16px;flex-wrap:wrap}
/* drawer */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,100vw);background:var(--bg);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column}
.drawer-h{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 18px}
.drawer-h h3{margin:0;font-size:18px;letter-spacing:-.01em}
.drawer-h .meta{color:var(--text-2);font-size:13px;margin-top:2px}
.drawer-h .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.drawer-b{overflow:auto;padding:14px 18px 40px;flex:1}
.sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px}
.sec > h4{margin:0;padding:10px 14px;font-size:13px;font-weight:650;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.sec > h4 .sp{flex:1}
.sec .in{padding:12px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fld label{display:block;font-size:11.5px;color:var(--text-2);font-weight:500;margin-bottom:3px}
.fld input:not([type=checkbox]),.fld select,.fld textarea{width:100%;border:1px solid var(--border-strong);background:var(--surface);border-radius:7px;padding:6px 8px;min-height:32px}
.fld textarea{min-height:80px;resize:vertical}
.fld.chk{display:flex;align-items:center;gap:8px;padding-top:18px}
.fld.chk label{margin:0;font-size:13px;color:var(--text)}
.fld.full{grid-column:1/-1}
.sc-row{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--border)}
.sc-row:last-child{border-bottom:0}
.sc-row .d{min-width:88px;font-weight:600}
.sc-row .t{flex:1}
.flag{display:flex;gap:10px;padding:7px 0;align-items:flex-start;border-bottom:1px dashed var(--border)}
.flag:last-child{border-bottom:0}
.tl{position:relative}
.tl-item{display:grid;grid-template-columns:92px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);align-items:start}
.tl-item:last-child{border-bottom:0}
.tl-item .d{font-weight:600;font-size:13px}
.tl-item .x{font-size:13px}
.tl-item .x .n{color:var(--text-2);font-size:12.5px;white-space:pre-wrap}
.tl-form{background:var(--surface-2);border-radius:8px;padding:10px;margin-top:10px}
.files{display:flex;flex-direction:column}
.file{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.file:last-child{border-bottom:0}
.file .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;color:var(--accent-ink)}
.file .nm:hover{text-decoration:underline}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--warning-soft);border-radius:99px;padding:3px 6px 3px 10px;font-size:12.5px}
.chip button{border:0;background:transparent;cursor:pointer;padding:0 4px;color:var(--text-2)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.drop{border:2px dashed var(--border-strong);border-radius:var(--radius);padding:14px;text-align:center;color:var(--text-2);font-size:13px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--bg);border-radius:14px;box-shadow:var(--shadow);width:min(920px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal.narrow{width:min(620px,100%)}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px 14px 0 0}
.modal-h h3{margin:0;font-size:16px;flex:1}
.modal-b{padding:16px 18px;overflow:auto;flex:1}
.modal-f{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;align-items:center;background:var(--surface);border-radius:0 0 14px 14px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols > .sticky{position:sticky;top:0;align-self:start}
.motivo{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--surface)}
.motivo.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.motivo .mh{display:flex;gap:8px;align-items:flex-start}
.motivo .mh label{font-weight:600;font-size:13px;flex:1;cursor:pointer}
.motivo textarea{width:100%;margin-top:6px;min-height:90px;border:1px solid var(--border-strong);border-radius:6px;padding:6px 8px;background:var(--surface);font-size:12.5px}
.preview{background:#fff;color:#111;border:1px solid var(--border);border-radius:8px;padding:28px 34px;font-family:"Times New Roman",Times,serif;font-size:13.5px;line-height:1.55;max-height:calc(100vh - 210px);overflow:auto}
.preview p{margin:0 0 8px;text-align:justify}
.preview .c{text-align:center} .preview .rt{text-align:right} .preview .b{font-weight:bold}
.spinner{width:16px;height:16px;border:2px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:9px;z-index:99;font-size:13px;box-shadow:var(--shadow);max-width:90vw}
/* sintesi */
.syn-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bars{padding:12px 14px}
.bar-row{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;padding:4px 0;font-size:13px;position:relative}
.bar-row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.bar-row .track{height:14px;position:relative}
.bar-row .fill{height:14px;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.bar-row .val{text-align:right;font-variant-numeric:tabular-nums}
.bar-row:hover .fill{filter:brightness(1.12)}
.bar-row:hover{background:var(--surface-2)}
.vbars{display:flex;align-items:flex-end;gap:14px;height:190px;padding:18px 14px 0;border-bottom:1px solid var(--border-strong);margin:0 14px}
.vbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.vbar .fill{width:100%;max-width:56px;background:var(--bar);border-radius:4px 4px 0 0}
.vbar .top2{font-size:11px;color:var(--text-2);margin-bottom:4px}
.vbar .stack{display:flex;flex-direction:column;width:100%;max-width:56px;gap:2px}
.vbar .stack > span:first-child{border-radius:4px 4px 0 0}
.seg-p{background:var(--bar);display:block} .seg-r{background:var(--bar-soft);display:block} .seg-x{background:var(--extra);display:block}
.track.hstack{display:flex;gap:2px;height:14px} .track.hstack > span{height:14px} .track.hstack > span:last-child{border-radius:0 4px 4px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);padding:10px 14px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:7px;padding:2px}
.seg button{border:0;background:transparent;padding:3px 10px;border-radius:5px;cursor:pointer;font-size:12.5px;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1);font-weight:600}
.vbar .top{font-size:12px;font-weight:600;margin-bottom:3px}
.vbar:hover .fill{filter:brightness(1.12)}
.vlabels{display:flex;gap:14px;margin:0 14px;padding:6px 0 12px}
.vlabels div{flex:1;text-align:center;font-size:12px;color:var(--text-2)}
.tip{position:fixed;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;z-index:100;white-space:nowrap}
table.piv{width:100%;border-collapse:collapse;font-size:13px}
table.piv th,table.piv td{padding:7px 12px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
table.piv th:first-child,table.piv td:first-child{text-align:left}
table.piv th{font-size:12px;color:var(--text-2);font-weight:600}
table.piv tr.grp td{font-weight:600;cursor:pointer}
table.piv tr.sub td{color:var(--text-2)} table.piv tr.sub td:first-child{padding-left:30px}
table.piv tr.tot td{font-weight:700;border-top:2px solid var(--border-strong)}
.hidden{display:none!important}
@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .syn-grid,.cols{grid-template-columns:1fr}
  .col-hide{display:none}
  .top-in,main{padding-left:16px;padding-right:16px}
}
@media (max-width:700px){ header.top{position:static} }
body.welcome-mode #btnNewDoc,body.welcome-mode #btnNewManual,body.welcome-mode #btnSettings,body.welcome-mode #btnCam,body.welcome-mode nav.tabs,body.welcome-mode #archStatus{display:none!important}
.only-mobile{display:none}
@media (max-width:700px){
  .only-mobile{display:inline-flex}
  .top-in{gap:8px;padding-top:8px;padding-bottom:8px}
  #btnNewManual{display:none}
  #btnSettings{padding:7px 9px} #btnSettings::after{content:''}
  .arch{order:10;width:100%;font-size:12px}
  .brand{font-size:15px}
  .todo-list{grid-template-columns:1fr;padding:10px}
  .filters select{flex:1 1 45%}
  .modal-bg{padding:0;display:block} .modal{border-radius:0;max-height:100vh;height:100vh;width:100vw;max-width:100vw}
  .modal-b{overflow-x:hidden;overflow-wrap:anywhere} .modal-b .sec{min-width:0} .modal-b code{word-break:break-all}
  .hide-m{display:none}
  .modal-h,.modal-f{border-radius:0}
  .drawer-b{padding:10px 10px 40px} .drawer-h{padding:12px}
  .fld input:not([type=checkbox]),.fld select,.fld textarea,.inp{font-size:16px}
}
@media (max-width:560px){ .grid2{grid-template-columns:1fr} .bar-row{grid-template-columns:100px 1fr 70px} }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><span class="logo">€</span>Gestione Multe <span class="tag" id="verTag" title="Versione dell'applicazione">V9</span></div>
  <nav class="tabs"><button data-view="multe" class="on">Multe</button><button data-view="sintesi">Sintesi</button></nav>
  <div class="spacer"></div>
  <div class="arch" id="archStatus"></div>
  <button class="btn primary" id="btnNewDoc">＋ Carica documento</button>
  <button class="btn only-mobile" id="btnCam" title="Scatta una foto del verbale">📷 Foto</button>
  <button class="btn" id="btnNewManual">Nuova multa</button>
  <button class="btn ghost" id="btnSettings" title="Impostazioni">⚙︎<span class="hide-m"> Impostazioni</span></button>
</div></header>
<main id="main"></main>
<input type="file" id="camPick" accept="image/*" capture="environment" class="hidden">
<input type="file" id="filePick" multiple accept="application/pdf,image/*,.zip,application/zip,.eml,message/rfc822" class="hidden">
<script>
'use strict';
const APP_VERSION = 'V9';
const APP_DATE = '2026-09-30'; // V3
const CHANGELOG = [
  ['V9', '2026-11-02', 'Versione online su GitHub Pages: archivio su OneDrive (Microsoft Graph, accesso con account Microsoft), salvataggio con controllo dei conflitti tra dispositivi e unione automatica delle modifiche, nessun dato nel file della pagina; impostazioni con pulsante Salva per sezione; versione per telefono con caricamento da fotocamera e compressione delle foto.'],

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayISO = () => isoOf(new Date());
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoOf(d); };
const addYears = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setFullYear(d.getFullYear() + n); return isoOf(d); };
const diffDays = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const fd = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '—';
const fdShort = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(2, 4) : '—';
const EURF = new Intl.NumberFormat('it-IT', {style: 'currency', currency: 'EUR'});

/* ============================== dominio ============================== */
const TIPI = ['Divieto di sosta', 'Eccesso di velocità', 'ZTL', 'Corsia preferenziale', 'Semaforo rosso', 'Telefono alla guida', 'Mancata comunicazione dati', 'Altro', 'Non specificato'];
const EV = {

  ricorso_ricevuto:   {l: 'Conferma ricezione ricorso'},

};
/** Infrazioni che comportano decurtazione punti e quindi la comunicazione dei dati del conducente. */
const TIPI_PUNTI = ['Eccesso di velocità', 'Semaforo rosso', 'Telefono alla guida'];
const PENDENZE_STD = ['Ricevuta pagamento', 'Modulo dati patente'];
const LV_LABEL = {scaduta: 'Scaduta', urgente: 'Urgente', vicina: 'Entro 30 gg', ok: 'Pianificata', attesa: 'In attesa', chiusa: 'Chiusa'};

/** Controllo informativo: sconto 30% applicato oltre i 5 giorni dalla notifica. Restituisce un testo o null. */
function checkSconto(notifica, ridotto, entro60, pagato, dataPag) {
  if (!notifica || !dataPag || pagato == null || !ridotto) return null;
  const lim = addDays(notifica, 5);
  if (dataPag <= lim) return null;
  const gg = diffDays(notifica, dataPag);
  if (entro60 && entro60 > ridotto + 0.5) {
    if (pagato < entro60 - 0.5) return `Pagati ${eur(pagato)} il ${fd(dataPag)}, ${gg} giorni dopo la notifica del ${fd(notifica)}: lo sconto del 30% valeva fino al ${fd(lim)}. Differenza teorica rispetto all'importo entro 60 gg: ${eur(entro60 - pagato)}.`;
    return null;
  }
  if (Math.abs(pagato - ridotto) <= 0.5) return `Pagati ${eur(pagato)} il ${fd(dataPag)}, ${gg} giorni dopo la notifica del ${fd(notifica)}: se era l'importo scontato del 30%, lo sconto valeva solo fino al ${fd(lim)} (importo entro 60 gg non indicato, differenza non calcolabile).`;
  return null;
}
function levelOf(days) { return days < 0 ? 'scaduta' : days <= 7 ? 'urgente' : days <= 30 ? 'vicina' : 'ok'; }
function evSorted(m) { return [...(m.eventi || [])].map((e, i) => ({e, i})).sort((a, b) => ((a.e.data || '9999') < (b.e.data || '9999') ? -1 : (a.e.data || '9999') > (b.e.data || '9999') ? 1 : a.i - b.i)).map(x => x.e); }
const later = (a, b) => a && (!b || (a.data || '') >= (b.data || ''));

/** Calcola fase, scadenze, esito e controlli di una multa. */
function analizza(m) {
  const T = todayISO();
  const ev = evSorted(m);
  const last = t => ev.filter(e => e.tipo === t).pop();
  const pagato = sum(ev.filter(e => EV[e.tipo]?.pay).map(e => e.importo));
  const sc = [];
  const push = (label, date, soft) => { if (date) sc.push({label, date, days: diffDays(T, date), soft: !!soft}); };
  const pend = m.pendenze || [];
  const inoltrata = pend.includes('Ricevuta pagamento') || !!last('inoltro');
  const accolto = last('accolto'), respinto = last('respinto');
  const ing = last('ingiunzione'), pc = last('pagamento_cartella');
  const ord = last('ordinanza'), po = last('pagamento_ordinanza');
  const rg = last('ricorso_gdp'), rp = last('ricorso_prefetto');
  const pv = last('pagamento_verbale');
  let fase, label, silenzioDal = null;
  if (accolto) { fase = 'accolto'; label = 'Ricorso accolto'; }
  else if (ing && !later(pc, ing)) {
    fase = 'ingiunzione'; label = 'Ingiunzione / cartella da gestire';
    if (ing.data) { push('Termine opposizione al Giudice di Pace', addDays(ing.data, 30), inoltrata); push('Termine pagamento ingiunzione / cartella', addDays(ing.data, 60), inoltrata); }
  }
  else if (pc) { fase = 'pagata'; label = 'Pagata (ingiunzione/cartella)'; }
  else if (respinto && !ev.some(e => EV[e.tipo]?.pay && later(e, respinto)) && !later(ord, respinto)) {
    fase = 'respinto'; label = 'Ricorso respinto – da pagare';
    if (respinto.data) push(`Pagamento dopo la sentenza (30 gg)${respinto.importo ? ' · ' + eur(respinto.importo) : ''}`, addDays(respinto.data, 30), inoltrata);
  }
  else if (respinto) { fase = 'pagata'; label = 'Pagata dopo il rigetto'; }
  else if (ord && !po) {
    if (later(rg, ord)) { fase = 'gdp'; label = 'Opposizione al GdP in corso'; const u = last('udienza'); if (u && u.data >= T) push('Udienza Giudice di Pace', u.data); }
    else { fase = 'ordinanza'; label = 'Ordinanza da pagare o opporre'; if (ord.data) { push('Pagamento ordinanza (30 gg)', addDays(ord.data, 30), inoltrata); push('Opposizione al GdP (30 gg)', addDays(ord.data, 30), inoltrata); } }
  }
  else if (po) { fase = 'pagata'; label = 'Pagata (ordinanza)'; }
  else if (rg) {
    { fase = 'gdp'; label = 'Ricorso al GdP in corso'; const u = last('udienza'); if (u && u.data >= T) push('Udienza Giudice di Pace', u.data); }
  }
  else if (rp) {
    fase = 'prefetto'; label = 'Ricorso al Prefetto in corso';
    if (rp.data) {
      const gg = rp.destinatario === 'organo' ? 180 : 210;
      const d = addDays(rp.data, gg);
      if (d < T) { fase = 'silenzio'; label = 'Accolto per silenzio-assenso'; silenzioDal = d; }
      else push(`Termine decisione Prefetto (${gg} gg): poi silenzio-assenso`, d, true);
    }
  }
  else if (pv) { fase = 'pagata'; label = 'Pagata'; }
  else if (m.dataNotifica) {
    fase = 'da_gestire'; label = inoltrata ? 'Inoltrata – attesa ricevuta' : 'Da pagare o contestare';
    push('Pagamento ridotto del 30% (5 gg)', addDays(m.dataNotifica, 5), inoltrata); sc[sc.length - 1].opt = 'sconto';
    push('Ricorso al Giudice di Pace (30 gg)', addDays(m.dataNotifica, 30), inoltrata); if (m.percorso !== 'gdp') sc[sc.length - 1].opt = 'gdp';
    push('Pagamento o ricorso al Prefetto (60 gg)', addDays(m.dataNotifica, 60), inoltrata);
  } else {
    fase = 'attesa_notifica'; label = 'In attesa di notifica';
    if (m.dataInfrazione) push('Termine notifica (90 gg dall\'infrazione)', addDays(m.dataInfrazione, 90), true);
  }
  const datiMancanti = !!m.richiedeDatiConducente && !last('dati_conducente');
  if (datiMancanti && m.dataNotifica) { push('Invio modulo dati conducente (60 gg)', addDays(m.dataNotifica, 60)); sc[sc.length - 1].obbligo = true; }
  if (datiMancanti && fase === 'pagata') label += ' · manca modulo dati conducente';
  const autoChiusa = (fase === 'accolto' || fase === 'silenzio' || fase === 'pagata') && pend.length === 0 && !datiMancanti;
  const chiusa = !!m.chiusa || autoChiusa;
  let esito = '';
  if (chiusa) esito = fase === 'accolto' ? 'Ricorso accolto' : fase === 'silenzio' ? 'Accolto per silenzio-assenso' : fase === 'pagata' ? label : (m.chiusuraNota || 'Chiusa');
  sc.sort((a, b) => a.date < b.date ? -1 : 1);
  sc.forEach(s => s.level = s.soft ? (s.days < 0 ? 'attesa' : (s.days <= 7 ? 'urgente' : 'attesa')) : levelOf(s.days));
  let prossima = null;
  if (!chiusa) {
    const main = sc.filter(s => !s.opt && !s.obbligo);
    prossima = main.find(s => s.days >= 0) || main[main.length - 1] || sc.find(s => s.obbligo) || null;
    if (!prossima && pend.length) prossima = {label: 'In attesa: ' + pend.join(', ').toLowerCase(), date: null, days: null, level: 'attesa'};
    else if (prossima && pend.length && prossima.level !== 'scaduta') prossima = {...prossima, label: prossima.label + ' · attesa ' + pend.join(', ').toLowerCase()};
  }
  // controlli
  const flags = [];
  const ggNot = (m.dataInfrazione && m.dataNotifica) ? diffDays(m.dataInfrazione, m.dataNotifica) : null;
  if (ggNot !== null && ggNot > 90) {
    if (m.noleggio) flags.push({lv: 'vicina', t: `Notifica dopo ${ggNot} giorni. Veicolo a noleggio: i 90 giorni decorrono dall'acquisizione dei dati del locatario, verificare la data indicata nel verbale.`, motivo: 'notifica_tardiva'});
    else flags.push({lv: 'scaduta', t: `Notifica dopo ${ggNot} giorni (oltre i 90 dell'art. 201 CdS): possibile vizio di forma.`, motivo: 'notifica_tardiva'});
  }
  if (/mai/i.test(m.modalitaNotifica || '') ) flags.push({lv: 'scaduta', t: 'Verbale indicato come mai ricevuto: valutare omessa notifica.', motivo: 'omessa_notifica'});
  if ((ing || ord) && m.dataInfrazione) {
    const atto = ing || ord;
    if (atto.data && atto.data > addYears(m.dataInfrazione, 5)) flags.push({lv: 'scaduta', t: `Atto ricevuto oltre 5 anni dopo l'infrazione: verificare la prescrizione.`, motivo: 'prescrizione'});
  }
  if (fase === 'silenzio') flags.push({lv: 'ok', t: `Il Prefetto non ha deciso entro il ${fd(silenzioDal)}: ricorso accolto per silenzio-assenso (art. 204, c. 1-ter CdS). Un'ordinanza notificata dopo va contestata come tardiva: se arriva, caricala e la pratica si riapre.`});
  if (rp && rp.data && ord && ord.data && later(ord, rp)) {
    const lim = addDays(addDays(rp.data, rp.destinatario === 'organo' ? 180 : 210), 150);
    if (ord.data > lim) flags.push({lv: 'scaduta', t: `Ordinanza notificata il ${fd(ord.data)}, oltre il termine per la decisione del Prefetto più i 150 giorni per la notifica (${fd(lim)}): ricorso da considerare accolto per silenzio-assenso.`, motivo: 'ordinanza_tardiva'});
  }
  const pvs = ev.filter(e => e.tipo === 'pagamento_verbale');
  if (pvs.length) { const msg = checkSconto(m.dataNotifica, Number(m.importo) || 0, Number(m.importo60) || 0, sum(pvs.map(e => e.importo)), pvs[pvs.length - 1].data); if (msg) flags.push({lv: 'vicina', t: msg}); }
  if (!m.nVerbale) flags.push({lv: 'ok', t: 'Numero di verbale mancante.'});
  if (!m.dataNotifica && m.eventi?.length === 0 && !chiusa && m.dataInfrazione && diffDays(m.dataInfrazione, T) > 100) flags.push({lv: 'ok', t: 'Nessuna notifica registrata dopo oltre 100 giorni.'});
  (m.anomalie || []).forEach(a => flags.push({lv: 'vicina', t: a, dati: true}));
  const obblighi = chiusa ? [] : sc.filter(s => s.obbligo && s !== prossima);
  const sconto = chiusa ? null : sc.find(s => s.opt === 'sconto' && s.days >= 0);
  return {fase, label, sc, prossima, chiusa, esito, pagato, flags, ggNot, obblighi, sconto};
}

/* =========================================================
   Strato archivio OneDrive — estratto da "Rimborsi trasferte" v0.1.1
   Da riusare nella dashboard multe. Nessuna libreria esterna.
   Da adattare: le chiavi localStorage/sessionStorage, POINTER_FILE e il nome del DB IndexedDB
   devono essere DIVERSI da quelli dei rimborsi, perché le due app condividono
   l'origine https://saverio800.github.io e quindi lo stesso localStorage.
   Dipendenze minime: dev = {clientId, root, account, mode}, saveDev(), ruid(), ls/ss helper.
   ========================================================= */
const GRAPH = 'https://graph.microsoft.com/v1.0';
const AUTH = 'https://login.microsoftonline.com/consumers/oauth2/v2.0';
const SCOPES = 'https://graph.microsoft.com/Files.ReadWrite offline_access openid profile';
const POINTER_FILE = 'multe.json';              // nella cartella app di OneDrive (approot): ricorda la cartella archivio
const TOK_KEY = 'multe.tok.v1';                  // DIVERSO da 'rimborsi.tok.v1'
const ruid = () => Math.random().toString(36).slice(2, 10);
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };
const ss = { get(k) { try { return JSON.parse(sessionStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch {} }, del(k) { try { sessionStorage.removeItem(k); } catch {} } };
const conflictErr = () => Object.assign(new Error('Il file è stato modificato da un altro dispositivo.'), {conflict: true});

/* Interfaccia comune dei due archivi:
   readJSON(path) -> {data, etag}|null ; writeJSON(path, data, etag?) -> etag (errore .conflict se l'etag non coincide)
   etagOf(path) ; putBlob(path, blob) ; getBlob(path) ; remove(path) ; rename(path, nuovoNome) ; list(dir) -> [{name, isFolder}]
   I path sono relativi alla cartella radice scelta dall'utente. */

/* --- archivio locale di prova (IndexedDB) — cambiare il nome del DB, es. 'multe-fs' --- */
class LocalFS {
  constructor() { this.kind = 'local'; }
  db() {
    if (!this._db) this._db = new Promise((res, rej) => {
      const r = indexedDB.open('multe-fs', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('f');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this._db;
  }
  async req(mode, fn) {
    const db = await this.db();
    return new Promise((res, rej) => { const r = fn(db.transaction('f', mode).objectStore('f')); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  }
  _get(k) { return this.req('readonly', s => s.get(k)); }
  _put(k, v) { return this.req('readwrite', s => s.put(v, k)); }
  _del(k) { return this.req('readwrite', s => s.delete(k)); }
  _keys() { return this.req('readonly', s => s.getAllKeys()); }
  async readJSON(p) { const r = await this._get(p); if (!r) return null; return {data: JSON.parse(await r.blob.text()), etag: r.etag}; }
  async writeJSON(p, data, etag) {
    if (etag) { const cur = await this._get(p); if (cur && cur.etag !== etag) throw conflictErr(); }
    const ne = ruid(); await this._put(p, {blob: new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'}), etag: ne}); return ne;
  }
  async etagOf(p) { const r = await this._get(p); return r ? r.etag : null; }
  async putBlob(p, blob) { await this._put(p, {blob, etag: ruid()}); }
  async getBlob(p) { const r = await this._get(p); if (!r) throw new Error('File non trovato: ' + p); return r.blob; }
  async remove(p) { for (const k of await this._keys()) if (k === p || k.startsWith(p + '/')) await this._del(k); }
  async rename(p, newName) {
    const np = p.split('/').slice(0, -1).concat(newName).join('/');
    for (const k of await this._keys()) if (k === p || k.startsWith(p + '/')) { const v = await this._get(k); await this._put(np + k.slice(p.length), v); await this._del(k); }
    return np;
  }
  async list(dir) {
    const pre = dir ? dir + '/' : ''; const out = new Map();
    for (const k of await this._keys()) if (k.startsWith(pre)) { const rest = k.slice(pre.length); const seg = rest.split('/')[0]; out.set(seg, {name: seg, isFolder: rest.includes('/')}); }
    return [...out.values()];
  }
  async wipe() { for (const k of await this._keys()) await this._del(k); }
}

const b64url = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const redirectUri = () => location.origin + location.pathname.replace(/index\.html$/, '');
const tok = { get: () => ls.get(TOK_KEY, null), set: v => ls.set(TOK_KEY, v), clear: () => ls.del(TOK_KEY) };
async function msLogin() {
  if (!dev.clientId) throw new Error('Inserisci prima il Client ID dell\'app Microsoft.');
  const v = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const ch = b64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v))));
  const st = ruid() + ruid(); ss.set('pkce', {v, st});
  location.href = AUTH + '/authorize?' + new URLSearchParams({client_id: dev.clientId, response_type: 'code', redirect_uri: redirectUri(),
    scope: SCOPES, code_challenge: ch, code_challenge_method: 'S256', state: st, response_mode: 'query', prompt: 'select_account'});
}
async function tokenRequest(params) {
  const r = await fetch(AUTH + '/token', {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: new URLSearchParams(Object.assign({client_id: dev.clientId, scope: SCOPES}, params))});
  const j = await r.json().catch(() => ({}));

        if (!state.db.settings.veicoli.find(v => v.nome === m.vettura) && m.vettura) state.db.settings.veicoli.push({nome: m.vettura, targa: m.targa || '', noleggio: !!m.noleggio});
        let mainName = '';
        if (wantSave) { const names = savedNames = await saveAll(m); mainName = (names.find(x => x.i === mainIdx) || names[0]).n; m.eventi.push({id: uid('e'), tipo: 'nota', data: todayISO(), note: names.length > 1 ? `Documenti archiviati: ${names.map(x => x.n).join(', ')}` : 'Verbale archiviato', doc: mainName}); }

        let docName = ctx.alreadySaved || '';
        if (wantSave) { const names = savedNames = await saveAll(m); docName = (names.find(x => x.i === mainIdx) || names[0]).n; if (names.length > 1) m.eventi.push({id: uid('e'), tipo: 'nota', data: todayISO(), note: `Documenti archiviati: ${names.map(x => x.n).join(', ')}`}); }
        if (t !== '__none') {

          if (t === 'ricorso_prefetto') e.destinatario = 'prefetto';

          m.eventi.push(e);

        const ri = docInfo.findIndex(d => d.tipo === 'ricevuta_pagamento');

        const imp = $('#rvPayImp').value; if (imp !== '') e.importo = Math.round(parseFloat(imp) * 100) / 100;
        if ($('#rvPayMod').value.trim()) e.modalita = $('#rvPayMod').value.trim();

        m.pendenze = (m.pendenze || []).filter(p => p !== 'Ricevuta pagamento');

      learnTarga(m);
      if ((x.possibili_vizi || []).length) {

        for (const v of x.possibili_vizi) if (!m.viziAI.some(w => w.titolo === v.titolo)) m.viziAI.push({...v, data: todayISO()});

      if (ctx.multa) { renderDrawer(ctx.multa); refreshBehind(); } else { render(); openDetail(m.id); }
    } catch (e) { btn.disabled = false; alert('Errore: ' + e.message); }
  };

async function callClaudeWeb(prompt, tool) {

  const messages = [{role: 'user', content: prompt}];
  for (let i = 0; i < 5; i++) {
    const force = i >= 3;
    let j;
    try { j = await apiPost({model: modelName(), max_tokens: 8000, tools, tool_choice: force && canForce() ? {type: 'tool', name: tool.name} : {type: 'auto'}, messages}); }
    catch (e) { throw new Error(e.message + (/web_search/i.test(e.message) ? ' — verifica che la ricerca web sia abilitata nella Console Anthropic' : '')); }
    const tu = (j.content || []).find(c => c.type === 'tool_use' && c.name === tool.name);
    if (tu) return tu.input;
    messages.push({role: 'assistant', content: j.content});
    if (j.stop_reason !== 'pause_turn') messages.push({role: 'user', content: `Ora registra il risultato chiamando lo strumento ${tool.name}.`});
  }
  throw new Error('La ricerca non ha prodotto un risultato');
}

  const art = m.articolo ? 'dell\'' + m.articolo.replace(/^art\.?\s*/i, 'art. ') + ' del Codice della Strada' : 'del Codice della Strada';

  const modNot = /pec/i.test(m.modalitaNotifica || '') ? 'a mezzo PEC' : /post|raccom/i.test(m.modalitaNotifica || '') ? 'a mezzo posta' : '';

  const motivi = R.motivi.filter(x => x.on && x.x.trim());
  const writeMotivi = () => { P('MOTIVI', 'c', true); motivi.forEach((mo, i) => { P(`${i + 1}. ${mo.t.replace(/ \(solidità \w+\)$/, '')}`, 'p', true); mo.x.split(/\n+/).forEach(par => P(par)); }); if (!motivi.length) P('[inserire i motivi del ricorso]'); };
  const firma = () => { P(''); P(`${v(R.luogoFirma)}, ${fd(R.dataFirma)}`); P('Firma', 'r'); P(v(ric.nomeCompleto), 'r'); P('______________________', 'r'); };
  const allegati = () => { if (R.allegati.length) { P('Allegati:', 'p', true); R.allegati.forEach((x, i) => P(`${i + 1}. ${x}`)); } };
  const valore = Number(m.importo60 || m.importo || 0);
  if (R.sede === 'prefetto') {

    if (D.prefetturaPec) P('PEC: ' + D.prefetturaPec, 'r');

    P('');
    P(`OGGETTO: Ricorso ai sensi dell'art. 203 del D.Lgs. 30 aprile 1992, n. 285 avverso il verbale di accertamento n. ${v(m.nVerbale)} del ${fd(m.dataInfrazione)}, notificato in data ${fd(m.dataNotifica)}.`, 'p', true);
    P(anag + ',');

    P('– che il presente ricorso è proposto nel termine di sessanta giorni dalla notificazione del verbale;');
    P('RILEVATO', 'c', true);

    P('CHIEDE', 'c', true);
    P('che la S.V., esaminati gli atti, voglia dichiarare fondato il presente ricorso e, per l\'effetto, disporre con ordinanza motivata l\'archiviazione degli atti ai sensi dell\'art. 204, comma 1, del Codice della Strada.');
    if (R.audizione) P('Chiede altresì di essere sentito/a personalmente ai sensi dell\'art. 203, comma 1, del Codice della Strada.');

    allegati(); firma();
  } else {

    const titolo = {gdp_verbale: ['RICORSO IN OPPOSIZIONE A VERBALE DI ACCERTAMENTO', '(art. 204-bis D.Lgs. n. 285/1992 e art. 7 D.Lgs. n. 150/2011)'],
      gdp_ordinanza: ['RICORSO IN OPPOSIZIONE A ORDINANZA-INGIUNZIONE', '(art. 205 D.Lgs. n. 285/1992 e art. 6 D.Lgs. n. 150/2011)'],
      gdp_ingiunzione: ['RICORSO IN OPPOSIZIONE A INGIUNZIONE DI PAGAMENTO / CARTELLA DI PAGAMENTO', '(art. 7 D.Lgs. n. 150/2011 e, ove occorra, art. 615 c.p.c.)']}[R.sede];
    P(titolo[0], 'c', true); P(titolo[1], 'c');
    P(anag + ', che sta in giudizio personalmente,');
    P('– ricorrente –', 'c');
    P('CONTRO', 'c', true);
    if (R.sede === 'gdp_ordinanza') P(`Prefettura – Ufficio Territoriale del Governo di ${v(R.prefettura)}, in persona del Prefetto pro tempore`, 'c');
    else P(`${v(R.ente)}, in persona del legale rappresentante pro tempore${R.sede === 'gdp_ingiunzione' ? ', nonché nei confronti dell\'agente della riscossione che ha emesso l\'atto' : ''}`, 'c');
    P('– resistente –', 'c');
    if (R.sede === 'gdp_verbale') P(`avverso il verbale di accertamento n. ${v(m.nVerbale)} del ${fd(m.dataInfrazione)}, notificato in data ${fd(m.dataNotifica)}.`, 'p', true);
    if (R.sede === 'gdp_ordinanza') { const o = evSorted(m).filter(e => e.tipo === 'ordinanza').pop(); P(`avverso l'ordinanza-ingiunzione${R.ordNum ? ' n. ' + R.ordNum : ''} emessa dal Prefetto di ${v(R.prefettura)}, notificata in data ${fd(o?.data)}, relativa al verbale di accertamento n. ${v(m.nVerbale)} del ${fd(m.dataInfrazione)}.`, 'p', true); }
    if (R.sede === 'gdp_ingiunzione') { const o = evSorted(m).filter(e => e.tipo === 'ingiunzione').pop(); P(`avverso ${R.ordAtto ? R.ordAtto : 'l\'ingiunzione / cartella di pagamento'}, notificata in data ${fd(o?.data)}, relativa alla presunta violazione accertata con verbale n. ${v(m.nVerbale)} del ${fd(m.dataInfrazione)}.`, 'p', true); }
    P('FATTO', 'c', true);
    if (R.sede === 'gdp_ingiunzione') P(`Il ricorrente ha ricevuto l'atto impugnato, con il quale gli viene richiesto il pagamento di somme relative a una presunta violazione del Codice della Strada (${infr}) che sarebbe stata commessa il ${fd(m.dataInfrazione)} in ${v(m.luogo)}.`);

    if (R.sede === 'gdp_ordinanza') { const rp = evSorted(m).filter(e => e.tipo === 'ricorso_prefetto').pop(); P(`${rp ? `Avverso tale verbale il ricorrente ha proposto ricorso al Prefetto in data ${fd(rp.data)}. ` : ''}Il Prefetto ha quindi emesso l'ordinanza-ingiunzione impugnata, che è illegittima per i motivi che seguono.`); }
    P(`Il presente ricorso è proposto nel termine di trenta giorni dalla notificazione dell'atto impugnato.`);
    writeMotivi();
    P('CONCLUSIONI', 'c', true);
    P(`Voglia l'Ill.mo Giudice di Pace adito, ${R.sospensiva ? 'in via preliminare, sospendere l\'efficacia esecutiva del provvedimento impugnato ai sensi dell\'art. 5 del D.Lgs. n. 150/2011, sussistendo gravi e circostanziate ragioni esplicitamente indicate nei motivi; nel merito, ' : ''}accogliere il ricorso e, per l'effetto, annullare ${R.sede === 'gdp_verbale' ? 'il verbale impugnato' : R.sede === 'gdp_ordinanza' ? 'l\'ordinanza-ingiunzione impugnata e il verbale presupposto' : 'l\'atto impugnato'}, con ogni conseguenza di legge. Con vittoria di spese.`);

function blocksToHTML(B) { return B.map(b => b.t === '' ? '<p>&nbsp;</p>' : `<p class="${b.s === 'c' ? 'c' : b.s === 'r' ? 'rt' : ''} ${b.b ? 'b' : ''}">${esc(b.t)}</p>`).join(''); }
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('impossibile caricare ' + src + ' (serve connessione internet)')); document.head.appendChild(s); }); }
async function buildDocx(B) {
  if (!window.docx) await loadScript('https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js');
  const {Document, Packer, Paragraph, TextRun, AlignmentType} = window.docx;
  const children = B.map(b => new Paragraph({
    alignment: b.s === 'c' ? AlignmentType.CENTER : b.s === 'r' ? AlignmentType.RIGHT : AlignmentType.JUSTIFIED,
    spacing: {after: b.b && b.s === 'c' ? 120 : 100, before: b.b && b.s === 'c' ? 200 : 0, line: 330},
    children: [new TextRun({text: b.t, bold: !!b.b, font: 'Times New Roman', size: 24})]
  }));
  const doc = new Document({creator: 'Gestione Multe ' + APP_VERSION, styles: {default: {document: {run: {font: 'Times New Roman', size: 24}}}},
    sections: [{properties: {page: {margin: {top: 1418, bottom: 1418, left: 1418, right: 1418}}}, children}]});
  return await Packer.toBlob(doc);
}

async function openMatchModal() {

  const unlinked = state.db.multe.filter(m => !m.cartella).length;
  const used = new Set(state.db.multe.map(m => m.cartella).filter(Boolean));
  const orphan = state.folders.filter(f => !used.has(f.path) && !props.some(p => p.f === f) && !state.folders.some(g => g.parent === f.path));
  modal('Abbina le cartelle dell\'archivio', `
    <p class="small">Trovate <b>${state.folders.length}</b> cartelle nell'archivio · <b>${unlinked}</b> multe senza cartella. Proposte di abbinamento (per numero di verbale, data e luogo):</p>

    ${orphan.length ? `<details><summary class="small">${orphan.length} cartelle non abbinate (collegale dalla scheda della multa)</summary><div class="small muted" style="columns:2;margin-top:6px">${orphan.map(f => esc(f.path)).join('<br>')}</div></details>` : ''}`,
    `<button class="btn" id="mCancel">Chiudi</button>${props.length ? '<button class="btn primary" id="mApply">Collega selezionate</button>' : ''}`);

}

function download(blob, name) { const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 20000); }
function exportCSV() {
  const cols = [['Data infrazione', m => m.dataInfrazione], ['Luogo', m => m.luogo], ['Vettura', m => m.vettura], ['Targa', m => m.targa], ['Responsabile', m => m.responsabile], ['N. verbale', m => m.nVerbale], ['Tipo', m => m.tipo], ['Dettaglio', m => m.dettaglio], ['Importo', m => m.importo], ['Data notifica', m => m.dataNotifica], ['Modalità notifica', m => m.modalitaNotifica], ['Giorni notifica', m => A(m).ggNot], ['Pagato', m => A(m).pagato], ['Stato', m => A(m).chiusa ? 'Chiusa - ' + A(m).esito : A(m).label], ['Prossima scadenza', m => A(m).prossima?.date || ''], ['Pendenze', m => (m.pendenze || []).join('; ')], ['Cartella', m => m.cartella], ['Note', m => m.note]];
  const q = v => { if (v === null || v === undefined) return ''; if (typeof v === 'number') return String(v).replace('.', ','); return '"' + String(v).replace(/"/g, '""') + '"'; };
  const csv = '﻿' + cols.map(c => q(c[0])).join(';') + '\n' + state.db.multe.map(m => cols.map(c => q(c[1](m))).join(';')).join('\n');
  download(new Blob([csv], {type: 'text/csv;charset=utf-8'}), 'multe_' + todayISO() + '.csv');
}
function applyTheme() { const t = lsGet('multe.theme'); if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }

/* ============================== sintesi ============================== */
const synF = {anno: '', resp: '', gResp: 'Saverio', open: {}, misAnno: lsGet('multe.misAnno') || 'eur', misTipo: lsGet('multe.misTipo') || 'eur'};
function renderSintesi() {
  const ms = state.db.multe.filter(m => (!synF.anno || (m.dataInfrazione || '').startsWith(synF.anno)) && (!synF.resp || m.responsabile === synF.resp));
  const gs = state.db.multe.filter(m => (!synF.anno || (m.dataInfrazione || '').startsWith(synF.anno)) && (!synF.gResp || m.responsabile === synF.gResp));
  // scomposizione importi: pagato entro il richiesto, maggiorazioni oltre, residuo non pagato
  const split = arr => { let ric = 0, pag = 0, extra = 0; arr.forEach(m => { const r = Number(m.importo) || 0, p = A(m).pagato; ric += r; pag += Math.min(p, r); extra += Math.max(0, p - r); }); return {ric, pag, extra, tot: ric + extra, paidAll: pag + extra}; };
  const tipOf = (k, a) => { const x = split(a); return `${k}: ${a.length} multe · richiesto ${eur(x.ric)} · pagato ${eur(x.paidAll)}${x.ric ? ' (' + Math.round(x.paidAll / x.ric * 100) + '%)' : ''}${x.extra ? ' · di cui maggiorazioni ' + eur(x.extra) : ''}`; };
  const toggle = (id, cur) => `<span class="spacer" style="flex:1"></span><span class="seg">${[['eur', '€'], ['n', 'N. multe']].map(([v, l]) => `<button class="${cur === v ? 'on' : ''}" data-mis="${id}" data-v="${v}">${l}</button>`).join('')}</span>`;
  const legend = `<div class="legend"><span><i style="background:var(--bar)"></i>Pagato</span><span><i style="background:var(--bar-soft)"></i>Non pagato</span><span><i style="background:var(--extra)"></i>Maggiorazioni</span></div>`;
  const payBy = (m, t) => sum(m.eventi.filter(e => e.tipo === t).map(e => e.importo));
  const row = arr => ({n: arr.length, ric: sum(arr.map(m => m.importo)), pv: sum(arr.map(m => payBy(m, 'pagamento_verbale'))), po: sum(arr.map(m => payBy(m, 'pagamento_ordinanza'))), pc: sum(arr.map(m => payBy(m, 'pagamento_cartella')))});
  const group = (arr, key) => { const g = {}; arr.forEach(m => (g[m[key] || 'Non indicato'] = g[m[key] || 'Non indicato'] || []).push(m)); return Object.entries(g).sort((a, b) => b[1].length - a[1].length); };
  const tot = row(ms);
  const ricorsi = ms.filter(m => m.eventi.some(e => e.tipo === 'ricorso_prefetto' || e.tipo === 'ricorso_gdp'));
  const accoltiEspl = ricorsi.filter(m => m.eventi.some(e => e.tipo === 'accolto')).length;
  const accoltiSil = ricorsi.filter(m => A(m).fase === 'silenzio').length;
  const accolti = accoltiEspl + accoltiSil;
  const inCorso = ricorsi.filter(m => ['prefetto', 'gdp'].includes(A(m).fase) && !A(m).chiusa).length;
  const conOrd = ricorsi.filter(m => m.eventi.some(e => e.tipo === 'ordinanza' || e.tipo === 'respinto')).length;
  const yg = {}; gs.forEach(m => { const y = (m.dataInfrazione || '').slice(0, 4) || 'n.d.'; (yg[y] = yg[y] || []).push(m); });
  const byYear = Object.entries(yg).sort((a, b) => a[0].localeCompare(b[0]));
  const yVal = a => synF.misAnno === 'eur' ? split(a).tot : a.length;
  const maxY = Math.max(1, ...byYear.map(([, a]) => yVal(a)));
  const H = 170;
  const yearCol = (y, a) => {
    if (synF.misAnno === 'n') return `<div class="vbar" data-tip="${esc(tipOf(y, a))}"><span class="top num">${a.length}</span><span class="fill" style="height:${(a.length / maxY * H).toFixed(0)}px"></span></div>`;
    const x = split(a), px = v => (v / maxY * H).toFixed(1);
    return `<div class="vbar" data-tip="${esc(tipOf(y, a))}"><span class="top num">${eur0(x.ric)}</span><span class="top2 num">pagato ${eur0(x.paidAll)}</span>
      <span class="stack">${x.extra ? `<span class="seg-x" style="height:${px(x.extra)}px"></span>` : ''}<span class="seg-r" style="height:${px(x.ric - x.pag)}px"></span><span class="seg-p" style="height:${px(x.pag)}px"></span></span></div>`;
  };
  const tipoBars = () => {
    const entries = group(gs, 'tipo').map(([k, a]) => [k, a]).sort((p, q) => (synF.misTipo === 'eur' ? split(q[1]).tot - split(p[1]).tot : q[1].length - p[1].length));
    const max = Math.max(1, ...entries.map(([, a]) => synF.misTipo === 'eur' ? split(a).tot : a.length));
    return entries.map(([k, a]) => {
      if (synF.misTipo === 'n') return `<div class="bar-row" data-tip="${esc(tipOf(k, a))}"><span class="lab" title="${esc(k)}">${esc(k)}</span><span class="track"><span class="fill" style="display:block;width:${(a.length / max * 100).toFixed(1)}%"></span></span><span class="val">${a.length}</span></div>`;
      const x = split(a), pc = v => (v / max * 100).toFixed(2) + '%';
      return `<div class="bar-row" data-tip="${esc(tipOf(k, a))}"><span class="lab" title="${esc(k)}">${esc(k)}</span><span class="track hstack"><span class="seg-p" style="width:${pc(x.pag)}"></span><span class="seg-r" style="width:${pc(x.ric - x.pag)}"></span>${x.extra ? `<span class="seg-x" style="width:${pc(x.extra)}"></span>` : ''}</span><span class="val">${eur0(x.ric)}</span></div>`;
    }).join('');
  };
  const hbars = (entries, valFn, fmt) => { entries = [...entries].sort((a, b) => valFn(b[1]) - valFn(a[1])); const max = Math.max(1, ...entries.map(e => valFn(e[1]))); return entries.map(([k, a]) => `<div class="bar-row" data-tip="${esc(k)}: ${a.length} multe · richiesto ${eur(sum(a.map(m => m.importo)))} · pagato ${eur(sum(a.map(m => A(m).pagato)))}"><span class="lab" title="${esc(k)}">${esc(k)}</span><span class="track"><span class="fill" style="display:block;width:${(valFn(a) / max * 100).toFixed(1)}%"></span></span><span class="val">${fmt(valFn(a))}</span></div>`).join(''); };
  const pivRow = (label, r, cls, attrs = '') => `<tr class="${cls}" ${attrs}><td>${label}</td><td class="num">${r.n}</td><td class="num">${eur(r.ric)}</td><td class="num">${eur(r.pv)}</td><td class="num">${eur(r.po)}</td><td class="num">${eur(r.pc)}</td><td class="num"><b>${eur(r.pv + r.po + r.pc)}</b></td></tr>`;
  $('#main').innerHTML = `
  <div class="card" style="margin-bottom:14px"><div class="filters" style="border:0">
    <b>Sintesi</b><span class="spacer" style="flex:1"></span>
    <select id="sfAnno"><option value="">Tutti gli anni</option>${anni().map(a => `<option ${synF.anno === a ? 'selected' : ''}>${a}</option>`).join('')}</select>
    <select id="sfResp"><option value="">Tabella e totali: tutti i responsabili</option>${uniq('responsabile').map(r => `<option value="${esc(r)}" ${synF.resp === r ? 'selected' : ''}>Tabella e totali: ${esc(r)}</option>`).join('')}</select>
  </div></div>
  <div class="kpis">
    <div class="kpi"><div class="l">Multe</div><div class="v num">${tot.n}</div><div class="s">${ms.filter(m => !A(m).chiusa).length} ancora aperte</div></div>
    <div class="kpi"><div class="l">Importo richiesto</div><div class="v num">${eur0(tot.ric)}</div><div class="s">media ${eur(tot.n ? tot.ric / tot.n : 0)}</div></div>
    <div class="kpi"><div class="l">Totale pagato</div><div class="v num">${eur0(tot.pv + tot.po + tot.pc)}</div><div class="s">di cui ordinanze e cartelle ${eur0(tot.po + tot.pc)}</div></div>
    <div class="kpi"><div class="l">Ricorsi presentati</div><div class="v num">${ricorsi.length}</div><div class="s">${inCorso} in corso</div></div>
    <div class="kpi"><div class="l">Ricorsi accolti</div><div class="v num">${accolti}</div><div class="s">${accoltiSil} per silenzio-assenso · ${conOrd} respinti o con ordinanza</div></div>
  </div>
  <div class="card" style="margin-bottom:14px"><div class="card-h"><h2>Per responsabile e tipo di infrazione</h2><span class="sub">clicca su un responsabile per il dettaglio</span></div><div style="overflow:auto">
    <table class="piv"><thead><tr><th>Responsabile / tipo</th><th>N.</th><th>Richiesto</th><th>Pagato verbali</th><th>Pagato ordinanze</th><th>Pagato cartelle</th><th>Totale pagato</th></tr></thead><tbody>
    ${group(ms, 'responsabile').map(([r, a]) => pivRow((synF.open[r] ? '▾ ' : '▸ ') + esc(r), row(a), 'grp', `data-grp="${esc(r)}"`) + (synF.open[r] ? group(a, 'tipo').map(([t, b]) => pivRow(esc(t), row(b), 'sub')).join('') : '')).join('')}
    ${pivRow('Totale', tot, 'tot')}</tbody></table></div></div>
  <div class="card" style="margin-bottom:14px"><div class="filters" style="border:0"><b>Grafici</b><span class="small muted">${gs.length} multe</span><span class="spacer" style="flex:1"></span>
    <select id="sfGResp"><option value="">Tutti i responsabili</option>${uniq('responsabile').map(r => `<option ${synF.gResp === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></div></div>
  <div class="syn-grid">
    <div class="card"><div class="card-h"><h2>Multe per anno di infrazione</h2><span class="sub">anno in cui è stata presa la multa · ${synF.misAnno === 'eur' ? 'importo richiesto e quota pagata' : 'numero di multe'}</span>${toggle('misAnno', synF.misAnno)}</div>
      ${synF.misAnno === 'eur' ? legend : ''}
      <div class="vbars" style="height:${H + 60}px">${byYear.map(([y, a]) => yearCol(y, a)).join('')}</div>
      <div class="vlabels">${byYear.map(([y]) => `<div>${y}</div>`).join('')}</div></div>
    <div class="card"><div class="card-h"><h2>Per tipo di infrazione</h2><span class="sub">${synF.misTipo === 'eur' ? 'importo richiesto e quota pagata' : 'numero di multe'}</span>${toggle('misTipo', synF.misTipo)}</div>
      ${synF.misTipo === 'eur' ? legend : ''}<div class="bars">${tipoBars()}</div></div>
    <div class="card"><div class="card-h"><h2>Per vettura</h2><span class="sub">importo richiesto</span></div><div class="bars">${hbars(group(gs, 'vettura'), a => sum(a.map(m => m.importo)), eur0)}</div></div>
    <div class="card"><div class="card-h"><h2>Comuni più frequenti</h2><span class="sub">numero di multe · primi 10</span></div><div class="bars">${hbars(group(gs, 'luogo').slice(0, 10), a => a.length, v => v)}</div></div>
  </div>`;
  $('#sfAnno').onchange = e => { synF.anno = e.target.value; renderSintesi(); };
  $('#sfResp').onchange = e => { synF.resp = e.target.value; renderSintesi(); };
  $('#sfGResp').onchange = e => { synF.gResp = e.target.value; renderSintesi(); };
  $$('[data-mis]').forEach(b => b.onclick = () => { synF[b.dataset.mis] = b.dataset.v; lsSet('multe.' + b.dataset.mis, b.dataset.v); renderSintesi(); });
  $$('[data-grp]').forEach(tr => tr.onclick = () => { synF.open[tr.dataset.grp] = !synF.open[tr.dataset.grp]; renderSintesi(); });
  bindTips();
}
function bindTips() {
  let tip = null;
  $$('[data-tip]').forEach(el => {
    el.onmousemove = e => { if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; document.body.appendChild(tip); } tip.textContent = el.dataset.tip; const w = tip.offsetWidth; tip.style.left = Math.min(e.clientX + 12, innerWidth - w - 8) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; };
    el.onmouseleave = () => { tip?.remove(); tip = null; };
  });
}

/* ============================== avvio ============================== */
applyTheme();
$$('nav.tabs button').forEach(b => b.onclick = () => { state.view = b.dataset.view; render(); window.scrollTo(0, 0); });
$('#btnNewDoc').onclick = openNewDocFlow;
$('#btnNewManual').onclick = openManualNew;
$('#btnSettings').onclick = openSettings;
$('#btnCam').onclick = () => { const p = $('#camPick'); p.value = ''; p.onchange = () => { if (p.files.length) startExtraction([...p.files], state.openId && $('#drawer') ? {multa: getM(state.openId)} : {}); }; p.click(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#modalBg')) closeModal(); else if ($('#drawer')) closeDrawer(); } });
// trascina un documento ovunque nella pagina per caricarlo
let dragDepth = 0;
window.addEventListener('dragover', e => { if (e.dataTransfer?.types?.includes('Files')) e.preventDefault(); });
window.addEventListener('drop', e => { if (!e.dataTransfer?.files?.length) return; e.preventDefault(); if ($('#modalBg')) return; const files = [...e.dataTransfer.files]; const m = state.openId && $('#drawer') ? getM(state.openId) : null; startExtraction(files, m ? {multa: m} : {}); });
window.addEventListener('focus', () => { checkRemote(); if (state.dirStatus === 'ok' && $('#drawer') && state.openId) { const m = getM(state.openId); if (m) renderDocs(m); } });
boot();
</script>
</body>
